  <script type="module">/* vulk:lenis-smooth-scroll v2 */
import Lenis from "../_lib/lenis.mjs";
// Framer-style inertial smoothing. Guards: mouse-only, respects
// prefers-reduced-motion, and only arms when the page actually scrolls
// (3D wheel-zoom viewers and dashboards stay untouched).
if (matchMedia("(pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let armed = false;
  const arm = () => {
    if (armed || document.documentElement.scrollHeight <= innerHeight + 80) return;
    armed = true;
    const lenis = new Lenis({ smoothWheel: true });
    const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
    document.documentElement.style.scrollBehavior = "auto";
  };
  addEventListener("load", () => { setTimeout(arm, 800); setTimeout(arm, 2500); setTimeout(arm, 6000); });
}
</script>
